<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>QualLeva?! · Comparador de preços</title>

    <meta name="description" content="Descubra qual embalagem vale mais a pena, por peso ou volume.">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">

    <!-- TAGS OPEN GRAPH -->
    <meta property="og:title" content="QualLeva?! · Comparador de preços" />
    <meta property="og:description"
        content="Leve o melhor custo-benefício. Compare preços por peso ou volume direto do carrinho de compras!" />
    <meta property="og:url" content="https://qualleva.vercel.app" />
    <meta property="og:type" content="website" />

    <meta property="og:image" content="assets/qualleva.jpg" />

    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topo">
        <h1>Qual<span>Leva</span>?!</h1>
        <button id="limpar" type="button">Limpar</button>
    </header>

    <main>
        <div class="seg" role="group" aria-label="O que você está comparando?">
            <button type="button" data-cat="peso" aria-pressed="true">Peso <small>g · kg</small></button>
            <button type="button" data-cat="liquido" aria-pressed="false">Líquido <small>ml · L</small></button>
        </div>
        <section id="resultado" class="resultado"></section>
        <p id="anuncio" class="sr" role="status"></p>
        <div id="cards"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
